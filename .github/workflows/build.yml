name: build-springbootweb
on: [push]
jobs:
  build-springbootweb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0 
        with:
          node-version: '26'
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # 6.0.0
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Build with Gradle
        run: |
           cd backend
           ./gradlew dependencyUpdates -DoutputFormatter=json,xml,html,txt,plain --refresh-dependencies
           ./gradlew clean build
